<!doctype html>
<html lang="en" data-direction="paper" data-theme="light" data-lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Card Workspace — landing page directions</title>
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="components.css" />
    <style>
      /* ====================================================================
         Review chrome. Intentionally neutral and outside the design system so
         it never reads as part of the page under evaluation.
         ==================================================================== */
      .cwx {
        position: fixed;
        z-index: 100;
        right: 16px;
        bottom: 16px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      .cwx__toggle {
        font: inherit;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        padding: 7px 11px;
        border: 0;
        border-radius: 6px;
        cursor: pointer;
        color: #f4f4f5;
        background: #18181b;
        box-shadow: 0 6px 20px -6px rgba(0, 0, 0, 0.5);
      }

      .cwx__panel {
        width: 268px;
        padding: 14px;
        border-radius: 10px;
        background: rgba(24, 24, 27, 0.96);
        backdrop-filter: blur(10px);
        color: #e4e4e7;
        box-shadow: 0 18px 44px -14px rgba(0, 0, 0, 0.6);
        display: grid;
        gap: 14px;
        max-height: 72vh;
        overflow: auto;
      }

      .cwx__group {
        display: grid;
        gap: 7px;
      }

      .cwx__legend {
        font-size: 9.5px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #a1a1aa;
      }

      .cwx__row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .cwx__chip {
        font: inherit;
        font-size: 11px;
        padding: 5px 9px;
        border: 0;
        border-radius: 5px;
        cursor: pointer;
        color: #d4d4d8;
        background: #27272a;
        box-shadow: inset 0 0 0 1px #3f3f46;
        transition: background-color 140ms cubic-bezier(0.4, 0, 0.2, 1),
          color 140ms cubic-bezier(0.4, 0, 0.2, 1);
      }

      .cwx__chip:hover {
        background: #333338;
      }

      .cwx__chip[data-active='true'] {
        background: #fafafa;
        color: #18181b;
        box-shadow: none;
      }

      .cwx__chip[data-family='warm'][data-active='true'] {
        background: #f5d0a9;
      }

      .cwx__chip[data-family='cool'][data-active='true'] {
        background: #b8d4f5;
      }

      .cwx__blurb {
        margin: 2px 0 0;
        font-size: 10.5px;
        line-height: 1.5;
        color: #a1a1aa;
      }

      @media (max-width: 560px) {
        .cwx__panel {
          width: min(268px, calc(100vw - 32px));
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <script type="text/babel" src="content.jsx"></script>
    <script type="text/babel" src="primitives.jsx"></script>
    <script type="text/babel" src="page.jsx"></script>
    <script type="text/babel" src="app.jsx"></script>
  </body>
</html>
