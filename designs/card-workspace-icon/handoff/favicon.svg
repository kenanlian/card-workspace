<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Card Workspace">
  <style>
    /* Presentation attributes below are the fallback; these rules win where
       CSS-in-SVG is supported and flip the mark for dark browser chrome. */
    @media (prefers-color-scheme: dark) {
      .cw-from { stop-color: #c4daf2; }
      .cw-to { stop-color: #a0bedd; }
      .cw-cards { fill: #0e1012; }
    }
  </style>
  <defs>
    <linearGradient id="cwFavicon" x1="0" y1="0" x2="1" y2="1">
      <stop class="cw-from" offset="0" stop-color="#3c4f64"/>
      <stop class="cw-to" offset="1" stop-color="#22374e"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#cwFavicon)"/>
  <g class="cw-cards" fill="#ffffff">
    <rect x="16" y="21" width="10" height="86" rx="5" opacity="0.75"/>
    <rect x="35" y="16" width="63" height="43" rx="11"/>
    <rect x="50" y="69" width="62" height="43" rx="11"/>
  </g>
</svg>
